[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-anonymous-cr-voting-system"
version = "0.1.0"
description = "Local academic prototype for class representative voting"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4.0",
  "portalocker>=2.10,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
